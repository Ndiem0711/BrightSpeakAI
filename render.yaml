# BrightSpeakAI — Render Cloud deployment; public demo uses TEST accounts only.
# COMMIT this file together with app/main.py and app/__init__.py at repository ROOT.
# Renaming existing Blueprint-managed resources may propose creating new resources.
databases:
  - name: brightspeakai
    plan: free
services:
  - type: web
    name: brightspeakai-app
    repo: https://github.com/Ndiem0711/BrightSpeakAI
    branch: main
    runtime: python
    plan: free
    buildCommand: python -c "import pathlib; assert pathlib.Path('app/main.py').is_file(), 'Missing app/main.py at GitHub repo root'" && pip install --no-cache-dir -r requirements.txt -r requirements-cloud.txt && APP_ENV=local DATABASE_URL=sqlite:///runtime/cloud-build-smoke.db python -c "import app.main; print('Backend import OK')"
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/system/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: APP_ENV
        value: cloud
      - key: REGISTRATION_MODE
        value: captcha
      - key: ASR_ENGINE
        value: gemini
      - key: AUDIO_FEEDBACK_ENABLED
        value: 'false'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brightspeakai
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FAST_FALLBACK_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FAST_TIMEOUT
        value: "15"
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.8-live
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
